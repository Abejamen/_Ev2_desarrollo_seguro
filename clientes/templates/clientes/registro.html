{% extends 'clientes/base.html' %}
{% block content %}
<h1>Registro de clientes</h1>

{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="{% url 'registro' %}">
    {% csrf_token %}

    <label for="id_username">Usuario</label>
    <input type="text" id="id_username" name="username" required maxlength="150"
           pattern="[a-zA-Z0-9_.-]+" autocomplete="username">

    <label for="id_email">Correo</label>
    <input type="email" id="id_email" name="email" required maxlength="254"
           autocomplete="email">

    <label for="id_password">Contraseña</label>
    <input type="password" id="id_password" name="password" required minlength="8"
           maxlength="128" autocomplete="new-password">

    <label for="id_rut">RUT</label>
    <input type="text" id="id_rut" name="rut" required maxlength="12"
           pattern="[0-9kK.-]+" placeholder="12.345.678-9" autocomplete="off">

    <label for="id_telefono">Teléfono</label>
    <input type="tel" id="id_telefono" name="telefono" required maxlength="15"
           pattern="[0-9+\s-]+" autocomplete="tel">

    <label for="id_direccion">Dirección de despacho</label>
    <input type="text" id="id_direccion" name="direccion" required maxlength="255"
           autocomplete="street-address">

    <button type="submit">Registrarme</button>
</form>

<p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
{% endblock %}
