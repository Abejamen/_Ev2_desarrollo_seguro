{% extends 'clientes/base.html' %}
{% block content %}
<h1>Iniciar sesión</h1>

{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}

    <label for="id_username">Usuario</label>
    <input type="text" id="id_username" name="username" required maxlength="150"
           autocomplete="username">

    <label for="id_password">Contraseña</label>
    <input type="password" id="id_password" name="password" required minlength="8"
           maxlength="128" autocomplete="current-password">

    <button type="submit">Entrar</button>
</form>

<p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
{% endblock %}
